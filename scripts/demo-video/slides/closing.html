<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Try it</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(160deg, #0f766e 0%, #115e59 70%, #0b4a45 100%);
    display: grid; place-items: center; color: #fff;
  }
  .wrap { text-align: center; width: 1300px; animation: rise 1s ease-out both; }
  .mark {
    width: 84px; height: 84px; margin: 0 auto 30px; border-radius: 20px;
    background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.25);
    display: grid; place-items: center; font-size: 46px; font-weight: 700;
  }
  h2 { font-size: 62px; font-weight: 700; letter-spacing: -1px; }
  p.lead { margin-top: 18px; font-size: 26px; color: rgba(255,255,255,0.85); }
  .pillars { display: flex; gap: 16px; justify-content: center; margin-top: 44px; flex-wrap: wrap; }
  .pill {
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.22);
    border-radius: 999px; padding: 12px 26px; font-size: 20px;
    opacity: 0; animation: fade .6s ease-out both;
  }
  .pill:nth-child(1){animation-delay:.6s} .pill:nth-child(2){animation-delay:1.2s}
  .pill:nth-child(3){animation-delay:1.8s} .pill:nth-child(4){animation-delay:2.4s}
  .cta {
    margin-top: 60px; display: inline-block; background: #fff; color: #0f766e;
    border-radius: 16px; padding: 22px 40px; font-size: 24px; font-weight: 600;
    box-shadow: 0 18px 44px rgba(0,0,0,0.25);
    opacity: 0; animation: fade .8s ease-out 3s both;
  }
  .cta small { display: block; font-weight: 400; color: #4b5563; font-size: 18px; margin-top: 8px; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  @keyframes fade { to { opacity: 1; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">A</div>
    <h2>Your appraisal workflow, in one place.</h2>
    <p class="lead">Responsive on any device · Role-shaped workspaces · Crash-proof drafts · Guided tutorials</p>
    <div class="pillars">
      <div class="pill">🇨🇦 Hosted in Montréal</div>
      <div class="pill">🌐 English &amp; French</div>
      <div class="pill">🤖 AI document extraction</div>
      <div class="pill">📱 Mobile field app</div>
    </div>
    <div class="cta">
      Try the live demo today
      <small>Manager Demo · password Demo2026!</small>
    </div>
  </div>
</body>
</html>
